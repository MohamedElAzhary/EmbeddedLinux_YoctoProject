# Distribution Information.
DISTRO = "infotainment"
DISTRO_NAME = "infotainment_distro"
DISTRO_VERSION = "1.0"

# SDK Information.
SDK_VENDOR = "-AzharySDK"
SDK_VERSION = "${@d.getVar('DISTRO_VERSION').replace('snapshot-${METADATA_REVISION}', 'snapshot')}"
SDK_VERSION[vardepvalue] = "${SDK_VERSION}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"

# Installation path
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

# Distro Features
INFOTAINMENT_DEFAULT_DISTRO_FEATURES = "largefile opengl multiarch vulkan x11 bluez5 bluetooth wifi qt5"
INFOTAINMENT_DEFAULT_EXTRA_RDEPENDS = "packagegroup-core-boot"
INFOTAINMENT_DEFAULT_EXTRA_RRECOMMENDS = "kernel-module-af-packet"

DISTRO_FEATURES ?= "${DISTRO_FEATURES_DEFAULT} ${INFOTAINMENT_DEFAULT_DISTRO_FEATURES} userland"

# systemd as init manager
require conf/distro/include/systemd.inc


# Packages Version
PREFERRED_VERSION_linux-yocto ?= "5.15%"
PREFERRED_VERSION_linux-yocto-rt ?= "5.15%"


# Build System configuration.
LOCALCONF_VERSION = "2"

# Poky sanity checks
INHERIT += "poky-sanity"
